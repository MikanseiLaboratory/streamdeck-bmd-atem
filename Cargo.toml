[package]
name = "streamdeck-atem"
version = "0.1.0"
edition = "2021"
description = "Stream Deck plugin for Blackmagic ATEM control"
license = "Apache-2.0"

[dependencies]
streamdeck-rs = { git = "https://github.com/FlowingSPDG/streamdeck-rs", rev = "4bdee355f5135a10cfc949d50efb675434cc2919" }
necromancer = { git = "https://github.com/Incomplete-Outputs-Lab/necromancer", branch = "feat/streamdeck" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
num-traits = "0.2"
