[package]
name = "streamdeck-atem"
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.85"
description = "Stream Deck plugin for Blackmagic ATEM control"
license = "Apache-2.0"

[lib]
name = "streamdeck_atem"
path = "src/lib.rs"

[[bin]]
name = "streamdeck-atem"
path = "src/main.rs"

[[bin]]
name = "typegen"
path = "src/bin/typegen.rs"

[dependencies]
anyhow = "1"
necromancer = { git = "https://github.com/Incomplete-Outputs-Lab/necromancer", branch = "feat/streamdeck" }
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streamdeck-plugin = { git = "https://github.com/MikanseiLaboratory/StreamDeckPluginRust", rev = "943e9b7e63a898de3e45012a2730d2c4ae34327a", features = ["macros", "typegen"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
ts-rs = "10.1"
tracing = "0.1"

[patch."https://github.com/Incomplete-Outputs-Lab/necromancer"]
necromancer_protocol = { path = "third_party/necromancer_protocol" }
