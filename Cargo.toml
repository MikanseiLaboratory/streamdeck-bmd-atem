[package]
name = "streamdeck-atem"
version = "0.2.3"
edition = "2021"
rust-version = "1.85"
description = "Stream Deck plugin for Blackmagic ATEM control"
license = "Apache-2.0"

[lib]
name = "streamdeck_atem"
path = "src/lib.rs"

[[bin]]
name = "streamdeck-atem"
path = "src/main.rs"

[[bin]]
name = "typegen"
path = "src/bin/typegen.rs"

[dependencies]
anyhow = "1"
# feat/streamdeck: protocol 2.32, AUX, and DSK. Typed InPr availability
# (903633588352809b7eaf5c3cb79e8c8158ba90b1) is on main, which stops at
# protocol 2.31 and has none of those commands. The bit layout from that
# commit is decoded in src/availability.rs against this rev's availability3.
necromancer = { git = "https://github.com/MikanseiLaboratory/necromancer", rev = "aee784e7db4dd32c890aa07491c10f92bf203611" }
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streamdeck-plugin = { git = "https://github.com/MikanseiLaboratory/StreamDeckPluginRust", rev = "943e9b7e63a898de3e45012a2730d2c4ae34327a", features = ["macros", "typegen"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
ts-rs = "10.1"
tracing = "0.1"
