# Package Stream Deck plugin into .streamDeckPlugin per distribution docs:
# https://docs.elgato.com/streamdeck/sdk/introduction/distribution/
name: Package Plugin

on:
  push:
    branches: [main, 'feature/**']
    tags:
      - "v*.*.*"
      - "v*.*.*-alpha.*"
      - "v*.*.*-beta.*"
  pull_request:
    branches: [main]

jobs:
  pack:
    name: Build & Pack (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release
        env:
          CARGO_TERM_COLOR: always

      - name: Copy binary into plugin directory (Windows)
        run: Copy-Item target\release\streamdeck-atem.exe dev.miseinul.atem.sdPlugin\

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Stream Deck CLI
        run: npm install -g @elgato/cli@latest

      - name: Validate plugin
        run: streamdeck validate dev.miseinul.atem.sdPlugin

      - name: Pack plugin (Windows)
        run: New-Item -ItemType Directory -Force -Path dist; streamdeck pack dev.miseinul.atem.sdPlugin --output dist --no-update-check -f

      - name: Upload .streamDeckPlugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-atem-plugin-windows-latest
          path: dist/

  pack-macos:
    name: Build & Pack (macos-latest)
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build release binary
        run: cargo build --release
        env:
          CARGO_TERM_COLOR: always

      - name: Copy binary into plugin directory (macOS)
        run: cp target/release/streamdeck-atem dev.miseinul.atem.sdPlugin/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Stream Deck CLI
        run: npm install -g @elgato/cli@latest

      - name: Validate plugin
        run: streamdeck validate dev.miseinul.atem.sdPlugin

      - name: Pack plugin (macOS)
        run: mkdir -p dist && streamdeck pack dev.miseinul.atem.sdPlugin --output dist --no-update-check -f

      - name: Upload .streamDeckPlugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-atem-plugin-macos-latest
          path: dist/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - pack
      - pack-macos
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: streamdeck-atem-plugin-windows-latest
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: streamdeck-atem-plugin-macos-latest
          path: dist/macos

      - name: Gather plugin files
        run: |
          mkdir -p release
          cp dist/windows/*.streamDeckPlugin release/ || true
          cp dist/macos/*.streamDeckPlugin release/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.streamDeckPlugin
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          name: ${{ (contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta')) && format('Beta {0}', github.ref_name) || format('Release {0}', github.ref_name) }}
          body: ${{ (contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta')) && format('This is a beta release for {0}. It is intended for testing and may be unstable.', github.ref_name) || format('Stable release {0}.', github.ref_name) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
