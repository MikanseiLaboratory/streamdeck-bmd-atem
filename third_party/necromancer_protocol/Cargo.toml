# Vendored from Incomplete-Outputs-Lab/necromancer feat/streamdeck @ fe28638751ac545740fe5dd371c2d88207846fcd.
# Upstream `Version::check_firmware_version` rejects protocol minor versions above 31.
# This copy accepts 2.32 so ATEM switchers that report that version can finish initialisation.
# The crate manifest is expanded out of the upstream workspace so it can be used as a path patch.

[package]
name = "necromancer_protocol"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Michael Farrell <micolous+git@gmail.com>"]
description = "Low level protocol primitives for Blackmagic ATEM control protocol"
repository = "https://github.com/Incomplete-Outputs-Lab/necromancer"
keywords = ["atem", "blackmagic"]

[features]
default = ["palette"]
serde = ["dep:serde"]
clap = ["dep:clap"]
palette = ["dep:palette"]

[dependencies]
binrw = "0.15.0"
chrono = "0.4.42"
clap = { version = "4.5.48", features = ["derive"], optional = true }
fixed = "1.29.0"
hex = "0.4.3"
modular-bitfield = "0.12.0"
num-derive = "0.4.2"
num-traits = "0.2.19"
palette = { version = "0.7.6", optional = true }
serde = { version = "1.0.226", features = ["derive"], optional = true }
thiserror = "2.0.16"
tracing = "0.1.41"

[dev-dependencies]
clap = { version = "4.5.48", features = ["derive"] }
flate2 = "1.1.2"
palette = "0.7.6"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
