<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="utf-8" />
  <title>ATEM DSK On Air</title>
  <script src="sdpi-components.js"></script>
  <style>
    .pi-status { margin-top: 12px; padding: 8px; border-radius: 4px; font-size: 12px; }
    .pi-status.connected { background: #d4edda; color: #155724; }
    .pi-status.disconnected { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <sdpi-item label="ATEM IP address">
    <sdpi-textfield setting="atem_ip" placeholder="192.168.1.100"></sdpi-textfield>
  </sdpi-item>

  <sdpi-item label="DSK key">
    <sdpi-select
      setting="key"
      datasource="atem_dsk_options"
      loading="Loading DSK keys...">
    </sdpi-select>
  </sdpi-item>

  <sdpi-item label="On key press">
    <sdpi-select setting="on_air" id="on_air_select">
      <option value="">Toggle (current state)</option>
      <option value="true">Set On Air</option>
      <option value="false">Set Off Air</option>
    </sdpi-select>
  </sdpi-item>

  <sdpi-item label="Connection">
    <div id="status" class="pi-status disconnected">Not connected</div>
  </sdpi-item>

  <script>
    (function () {
      var statusEl = document.getElementById('status');
      function updateStatus(connected) {
        if (!statusEl) return;
        statusEl.textContent = connected ? 'Connected to ATEM' : 'Not connected';
        statusEl.className = 'pi-status ' + (connected ? 'connected' : 'disconnected');
      }
      if (window.SDPIComponents && SDPIComponents.streamDeckClient) {
        SDPIComponents.streamDeckClient.sendToPropertyInspector.subscribe(function (event) {
          var payload = event && event.payload;
          if (!payload || payload.event !== 'atem_state') return;
          updateStatus(!!payload.connected);
        });
      }
      // SDPI select for on_air: we send "" for toggle, "true"/"false" for set.
      var sel = document.getElementById('on_air_select');
      if (sel) sel.addEventListener('change', function () {
        var v = sel.value;
        if (window.streamDeck && streamDeck.setSettings) {
          streamDeck.setSettings({ on_air: v === '' ? undefined : v === 'true' });
        }
      });
    })();
  </script>
</body>
</html>
